<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼실리테이션 시스템</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f0f2f5;min-height:100vh;color:#111827;}
.page{min-height:100vh;display:flex;flex-direction:column;}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 2px 16px rgba(0,0,0,.07);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1;}
.btn:hover{filter:brightness(.91);}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none;}
.btn-indigo{background:#4f46e5;color:#fff;}
.btn-green{background:#059669;color:#fff;}
.btn-red{background:#e11d48;color:#fff;}
.btn-blue{background:#2563eb;color:#fff;}
.btn-orange{background:#ea580c;color:#fff;}
.btn-gray{background:#f3f4f6;color:#374151;}
.btn-dark{background:#1e293b;color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:16px 20px;font-size:16px;}
textarea,input[type=text]{width:100%;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;background:#fafafa;color:#111827;resize:vertical;}
textarea:focus,input[type=text]:focus{border-color:#4f46e5;background:#fff;}
.tab-wrap{display:flex;gap:3px;background:#f3f4f6;padding:4px;border-radius:10px;}
.tab{flex:1;padding:8px 10px;border:none;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;background:transparent;color:#6b7280;transition:all .15s;white-space:nowrap;}
.tab.on{background:#fff;color:#111827;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.badge-live{background:#dcfce7;color:#15803d;}
.badge-end{background:#f3f4f6;color:#6b7280;}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.preset-btn{padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;line-height:1.4;}
.preset-btn.on{border-color:#4f46e5;background:#eef2ff;color:#3730a3;font-weight:700;}
.bar-wrap{height:40px;background:#f3f4f6;border-radius:10px;overflow:hidden;}
.bar-fill{height:100%;border-radius:10px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;transition:width .7s ease;}
.bar-pct{color:#fff;font-size:13px;font-weight:700;}
.stat{border-radius:12px;padding:14px;text-align:center;flex:1;min-width:80px;}
.stat-num{font-size:40px;font-weight:800;line-height:1;}
.stat-label{font-size:13px;margin-top:5px;font-weight:600;}
.stat-sub{font-size:12px;margin-top:2px;}
.vote-btn{width:100%;padding:18px;border:none;border-radius:13px;font-size:19px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;transition:all .2s;display:block;margin-bottom:12px;}
.vote-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.2);}
.vote-btn:active{transform:translateY(0);}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:999px;transition:.25s;}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s;}
.toggle input:checked+.toggle-slider{background:#4f46e5;}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);}
.par-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:#f9fafb;margin-bottom:6px;border:1px solid #f3f4f6;}
.choice-pill{padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;}
.pin-box{display:flex;gap:14px;justify-content:center;margin:20px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #d1d5db;transition:all .15s;}
.pin-dot.filled{background:#4f46e5;border-color:#4f46e5;}
.pin-dot.error{background:#ef4444;border-color:#ef4444;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.num-btn{padding:16px;border:1.5px solid #e5e7eb;border-radius:12px;background:#fff;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;color:#111827;}
.num-btn:hover{background:#f3f4f6;}
.num-btn:active{transform:scale(.93);background:#eef2ff;border-color:#4f46e5;}

/* ── 주식 MTS 스타일 ── */
.mts-wrap{min-height:100vh;background:#0d1117;display:flex;flex-direction:column;color:#fff;}
.mts-header{background:#161b27;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e2a3a;}
.mts-title{font-size:17px;font-weight:800;}
.mts-badge-buy{background:#e11d48;color:#fff;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;}
.mts-badge-sell{background:#2563eb;color:#fff;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;}
.mts-tabs{display:flex;border-bottom:1px solid #1e2a3a;}
.mts-tab{flex:1;padding:11px 8px;text-align:center;font-size:13px;color:#6b7280;border:none;background:none;cursor:pointer;font-family:inherit;font-weight:500;border-bottom:2px solid transparent;transition:all .15s;}
.mts-tab.on{color:#fff;border-bottom-color:#2563eb;font-weight:700;}
.mts-summary{background:#161b27;padding:14px 16px;border-bottom:1px solid #1e2a3a;}
.mts-summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.mts-label{font-size:12px;color:#6b7280;}
.mts-val{font-size:14px;font-weight:700;}
.mts-val-red{color:#f87171;}
.mts-val-blue{color:#60a5fa;}
.mts-val-white{color:#fff;}
.mts-table-header{display:grid;grid-template-columns:1fr 80px 80px 70px 70px;padding:8px 16px;background:#0d1117;border-bottom:1px solid #1e2a3a;}
.mts-th{font-size:11px;color:#6b7280;font-weight:600;text-align:right;}
.mts-th:first-child{text-align:left;}
.mts-row{display:grid;grid-template-columns:1fr 80px 80px 70px 70px;padding:13px 16px;border-bottom:1px solid #0d1117;align-items:center;background:#161b27;}
.mts-row:hover{background:#1e2a3a;}
.mts-stock-name{font-size:14px;font-weight:700;color:#fff;}
.mts-stock-sub{font-size:11px;color:#6b7280;margin-top:2px;}
.mts-cell{font-size:13px;text-align:right;color:#fff;}
.mts-cell-red{color:#f87171;font-weight:700;}
.mts-cell-blue{color:#60a5fa;font-weight:700;}
.mts-btn-buy{background:#e11d48;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.mts-btn-sell{background:#2563eb;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.mts-btn-buy:disabled,.mts-btn-sell:disabled{opacity:.3;cursor:not-allowed;}
.mts-bottom{background:#161b27;padding:10px 16px;border-top:1px solid #1e2a3a;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6b7280;}
.mts-bottom b{color:#f59e0b;font-size:13px;}

/* 매수/매도 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-end;}
.modal-sheet{background:#161b27;width:100%;border-radius:20px 20px 0 0;padding:1.5rem;color:#fff;max-width:500px;margin:0 auto;}
.modal-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:13px;color:#6b7280;margin-bottom:20px;}
.qty-control{display:flex;align-items:center;gap:16px;justify-content:center;margin:16px 0;}
.qty-btn{width:44px;height:44px;border:1.5px solid #334155;border-radius:10px;background:#0d1117;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:700;}
.qty-display{font-size:36px;font-weight:800;min-width:60px;text-align:center;}
.qty-info{background:#0d1117;border-radius:10px;padding:12px 16px;margin:12px 0;}
.qty-info-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.qty-info-row:last-child{margin-bottom:0;}
.modal-confirm-buy{width:100%;padding:15px;background:#e11d48;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;}
.modal-confirm-sell{width:100%;padding:15px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;}
.modal-cancel{width:100%;padding:12px;background:#1e293b;color:#94a3b8;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;}

/* 퍼실리테이터 주식 관리 */
.stock-item-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f9fafb;border-radius:10px;margin-bottom:8px;border:1px solid #f3f4f6;}
.stock-item-name{flex:1;font-weight:600;font-size:14px;}
.stock-item-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:18px;padding:2px 6px;}

/* 블라인드 화면 */
.blind-screen{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);border-radius:16px;padding:3rem 2rem;text-align:center;color:#fff;}
.blind-orb{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:52px;border:2px solid rgba(255,255,255,.15);}
.voting-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#a5b4fc;margin:0 3px;}
.voting-dot:nth-child(1){animation:pulse 1.2s .0s ease-in-out infinite;}
.voting-dot:nth-child(2){animation:pulse 1.2s .2s ease-in-out infinite;}
.voting-dot:nth-child(3){animation:pulse 1.2s .4s ease-in-out infinite;}
.btn-reveal{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-size:16px;padding:14px 28px;border-radius:12px;box-shadow:0 4px 20px rgba(239,68,68,.35);border:none;cursor:pointer;font-family:inherit;font-weight:800;display:inline-flex;align-items:center;gap:10px;transition:all .2s;}
.btn-reveal:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(239,68,68,.45);}

/* 프로그램 선택 카드 */
.prog-card{background:#fff;border-radius:16px;padding:1.5rem;box-shadow:0 2px 16px rgba(0,0,0,.07);border:2px solid transparent;cursor:pointer;transition:all .2s;text-align:left;}
.prog-card:hover{border-color:#4f46e5;transform:translateY(-3px);box-shadow:0 8px 24px rgba(79,70,229,.15);}
.prog-icon{font-size:40px;margin-bottom:12px;}
.prog-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.prog-desc{font-size:13px;color:#6b7280;line-height:1.5;}

/* 포트폴리오 결과 */
.port-bar-bg{height:12px;background:#f3f4f6;border-radius:999px;overflow:hidden;margin-top:6px;}
.port-bar-fill{height:100%;border-radius:999px;transition:width .8s ease;}

/* Animations */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease;}
@keyframes revealPop{0%{opacity:0;transform:scale(.92) translateY(16px)}60%{transform:scale(1.03) translateY(-3px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.reveal-pop{animation:revealPop .55s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes barGrow{from{width:0!important}to{}}
.bar-reveal{animation:barGrow .8s cubic-bezier(.34,1.2,.64,1) both;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.slide-up{animation:slideUp .3s ease;}

@media(max-width:580px){
  .preset-grid{grid-template-columns:1fr;}
  .stat-num{font-size:32px;}
  .stat-row{flex-wrap:wrap!important;}
  .mts-table-header,.mts-row{grid-template-columns:1fr 60px 60px 60px 60px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━
   CONFIG  ← 여기만 수정
━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const DB         = 'https://test01-53af5-default-rtdb.asia-southeast1.firebasedatabase.app';
const PASSCODE   = '1234';
const SHARE_PRICE = 10000;   // 1주 = 1만원
const INIT_CASH   = 1000000; // 초기 자본 = 100만원

/* ━━ 상수 ━━━━━━━━━━━━━━━━━ */
const C = ['#4f46e5','#22c55e','#ef4444','#f59e0b','#8b5cf6','#0ea5e9','#ec4899','#14b8a6'];
const PRESETS = [
  {label:'찬성 / 반대 / 중립',opts:['찬성','반대','중립']},
  {label:'찬성 / 반대',opts:['찬성','반대']},
  {label:'매우찬성 / 찬성 / 반대 / 매우반대',opts:['매우 찬성','찬성','반대','매우 반대']},
  {label:'동의 / 불동의 / 보류',opts:['동의','불동의','보류']},
];

/* ━━ Firebase REST ━━━━━━━━ */
async function fbGet(p){try{const r=await fetch(`${DB}/${p}.json`);return await r.json();}catch{return null;}}
async function fbSet(p,d){try{await fetch(`${DB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch{}}
async function fbDel(p){try{await fetch(`${DB}/${p}.json`,{method:'DELETE'});}catch{}}
async function fbPush(p,d){try{await fetch(`${DB}/${p}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch{}}

/* ━━ 상태 ━━━━━━━━━━━━━━━━━ */
const pid = 'p'+Math.random().toString(36).substr(2,9);
const st = {
  view:'home',          // home|lock|progSelect|parVote|parStock|dash
  dashTab:'voteBoard',  // voteBoard|voteFac|stockBoard|stockFac

  /* 공통 */
  nameInput:'', name:'',
  pinInput:'', pinError:false,

  /* 투표 */
  preset:0, qText:'',
  q:null, votes:{}, anon:false, revealed:false, justRevealed:false,
  myVote:null,

  /* 주식 */
  stockStatus:'idle',   // idle|listing|active|ended
  stockItems:{},        // {id:{name, order}}
  stockOrder:[],        // [id,...] 정렬용
  myCash:INIT_CASH,
  myPortfolio:{},       // {stockId: qty}
  allHoldings:{},       // {pid:{name,cash,portfolio}}
  newStockInput:'',
  mtsTab:'holdings',    // holdings|portfolio
  tradeModal:null,      // {stockId, type:'buy'|'sell', qty:1}
};
let pollTimer=null;

/* ━━ 유틸 ━━━━━━━━━━━━━━━━━ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
function fmt(n){return Number(n).toLocaleString('ko-KR');}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━
   RENDER
━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function render(){
  const app=$('app');
  switch(st.view){
    case 'home':       app.innerHTML=homeHTML();       bindHome();break;
    case 'lock':       app.innerHTML=lockHTML();       bindLock();break;
    case 'progSelect': app.innerHTML=progSelectHTML(); bindProgSelect();break;
    case 'parVote':    app.innerHTML=parVoteHTML();    bindParVote();break;
    case 'parStock':   app.innerHTML=parStockHTML();   bindParStock();break;
    case 'dash':       app.innerHTML=dashHTML();       bindDash();break;
  }
}

/* ──────────────────────────
   HOME
────────────────────────── */
function homeHTML(){return`
<div class="page" style="background:linear-gradient(135deg,#eef2ff 0%,#f0f9ff 100%)">
  <div class="center">
    <div class="card fade-in" style="max-width:420px;width:100%;text-align:center;padding:2.75rem">
      <div style="font-size:52px;margin-bottom:14px">🎯</div>
      <h1 style="font-size:22px;font-weight:800;margin-bottom:6px">퍼실리테이션 시스템</h1>
      <p style="color:#6b7280;font-size:14px;margin-bottom:36px">역할을 선택해주세요</p>
      <div style="display:flex;flex-direction:column;gap:14px">
        <button class="btn btn-green btn-block btn-lg" id="btnPar" style="font-size:17px;padding:18px">🙋 참가자로 참여하기</button>
        <button class="btn btn-indigo btn-block btn-lg" id="btnDash" style="font-size:17px;padding:18px">📊 대시보드 현황판</button>
      </div>
      <p style="font-size:12px;color:#9ca3af;margin-top:28px">같은 링크에서 역할만 다르게 선택하세요</p>
    </div>
  </div>
</div>`;}
function bindHome(){
  $('btnPar')?.addEventListener('click',()=>{st.view='progSelect';render();});
  $('btnDash')?.addEventListener('click',()=>{st.pinInput='';st.pinError=false;st.view='lock';render();});
}

/* ──────────────────────────
   LOCK (PIN)
────────────────────────── */
function lockHTML(){
  const f=st.pinInput.length;
  const dots=[0,1,2,3].map(i=>`<div class="pin-dot ${f>i?(st.pinError?'error':'filled'):''}"></div>`).join('');
  const nums=['1','2','3','4','5','6','7','8','9','','0','←'];
  const pad=nums.map(n=>`<button class="num-btn" data-n="${n}" ${n===''?'style="visibility:hidden"':''}>${n}</button>`).join('');
  return`
<div class="page" style="background:linear-gradient(135deg,#eef2ff 0%,#f0f9ff 100%)">
  <div class="center">
    <button class="btn btn-gray" id="lockBack" style="position:fixed;top:16px;left:16px;font-size:13px">← 뒤로</button>
    <div class="card fade-in" style="max-width:320px;width:100%;text-align:center;padding:2rem">
      <div style="font-size:40px;margin-bottom:10px">🔐</div>
      <h2 style="font-size:18px;font-weight:800;margin-bottom:4px">보안코드 입력</h2>
      <p style="font-size:13px;color:#6b7280;margin-bottom:2px">대시보드 전용 화면입니다</p>
      <p style="font-size:13px;height:20px;color:#ef4444;font-weight:600;margin-top:4px">${st.pinError?'코드가 올바르지 않습니다':''}</p>
      <div class="pin-box">${dots}</div>
      <div class="numpad">${pad}</div>
    </div>
  </div>
</div>`;}
function bindLock(){
  $('lockBack')?.addEventListener('click',()=>{st.view='home';render();});
  document.querySelectorAll('.num-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const n=b.dataset.n;
      if(n==='←'){st.pinInput=st.pinInput.slice(0,-1);st.pinError=false;render();return;}
      if(n===''||st.pinInput.length>=4)return;
      st.pinInput+=n;render();
      if(st.pinInput.length===4){
        if(st.pinInput===PASSCODE){
          st.pinInput='';st.pinError=false;st.view='dash';render();startPoll('dash');
        } else {
          st.pinError=true;render();
          setTimeout(()=>{st.pinInput='';st.pinError=false;render();},900);
        }
      }
    });
  });
}

/* ──────────────────────────
   프로그램 선택 + 이름 입력
────────────────────────── */
function progSelectHTML(){
  if(!st.name){return`
<div class="page" style="background:#f0f2f5">
  <button class="btn btn-gray" id="psBack" style="position:fixed;top:16px;left:16px;font-size:13px;z-index:99">← 뒤로</button>
  <div class="center">
    <div class="card fade-in" style="max-width:380px;width:100%;text-align:center;padding:2.5rem">

function tradeModalHTML(){
  if(!st.tradeModal)return'';
  const {stockId,type,qty}=st.tradeModal;
  const s=st.stockItems[stockId];
  if(!s)return'';
  const isBuy=type==='buy';
  const maxBuy=Math.floor(st.myCash/SHARE_PRICE);
  const maxSell=st.myPortfolio[stockId]||0;
  const maxQty=isBuy?maxBuy:maxSell;
  const totalCost=qty*SHARE_PRICE;
  return`
<div class="modal-overlay" id="tradeOverlay">
  <div class="modal-sheet slide-up">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div>
        <div class="modal-title">${s.name}</div>
        <div class="modal-sub">${isBuy?'매수':'매도'} · 1주당 ₩${fmt(SHARE_PRICE)}</div>
      </div>
      <span style="${isBuy?'background:#e11d4820;color:#e11d48':'background:#2563eb20;color:#2563eb'};padding:4px 12px;border-radius:8px;font-size:13px;font-weight:700">${isBuy?'매수':'매도'}</span>
    </div>
    <div class="qty-control">
      <button class="qty-btn" id="qtyMinus">−</button>
      <div class="qty-display">${qty}</div>
      <button class="qty-btn" id="qtyPlus">+</button>
    </div>
    <div class="qty-info">
      <div class="qty-info-row">
        <span style="color:#94a3b8">주문 금액</span>
        <span style="font-weight:700;color:#fff">₩${fmt(totalCost)}</span>
      </div>
      ${isBuy?`
      <div class="qty-info-row">
        <span style="color:#94a3b8">주문 후 잔여 현금</span>
        <span style="color:#60a5fa;font-weight:700">₩${fmt(st.myCash-totalCost)}</span>
      </div>
      <div class="qty-info-row" style="margin:0">
        <span style="color:#94a3b8">최대 매수 가능</span>
        <span style="color:#94a3b8">${maxBuy}주</span>
      </div>`:`
      <div class="qty-info-row" style="margin:0">
        <span style="color:#94a3b8">보유수량</span>
        <span style="color:#94a3b8">${maxSell}주</span>
      </div>`}
    </div>
    <button class="${isBuy?'modal-confirm-buy':'modal-confirm-sell'}" id="tradeConfirm" ${qty===0?'disabled':''}>
      ${isBuy?`📈 ${qty}주 매수 확정`:`📉 ${qty}주 매도 확정`}
    </button>
    <button class="modal-cancel" id="tradeCancel">취소</button>
  </div>
</div>`;}

function bindParStock(){
  document.querySelectorAll('.mts-btn-buy,.mts-btn-sell').forEach(b=>{
    b.addEventListener('click',()=>{
      st.tradeModal={stockId:b.dataset.sid,type:b.dataset.type,qty:1};render();
    });
  });
  $('mtsTabHoldings')?.addEventListener('click',()=>{st.mtsTab='holdings';render();});
  $('mtsTabPort')?.addEventListener('click',()=>{st.mtsTab='portfolio';render();});
  bindTradeModal();
}
function bindTradeModal(){
  if(!st.tradeModal)return;
  const {type}=st.tradeModal;
  const maxBuy=Math.floor(st.myCash/SHARE_PRICE);
  const maxSell=st.myPortfolio[st.tradeModal.stockId]||0;
  const maxQty=type==='buy'?maxBuy:maxSell;
  $('qtyMinus')?.addEventListener('click',()=>{if(st.tradeModal.qty>0)st.tradeModal.qty--;render();});
  $('qtyPlus')?.addEventListener('click',()=>{if(st.tradeModal.qty<maxQty)st.tradeModal.qty++;render();});
  $('tradeConfirm')?.addEventListener('click',async()=>{
    const {stockId,type,qty}=st.tradeModal;
    if(qty===0)return;
    if(type==='buy'){
      const cost=qty*SHARE_PRICE;
      if(st.myCash<cost)return;
      st.myCash-=cost;
      st.myPortfolio[stockId]=(st.myPortfolio[stockId]||0)+qty;
    } else {
      const held=st.myPortfolio[stockId]||0;
      if(held<qty)return;
      st.myCash+=qty*SHARE_PRICE;
      st.myPortfolio[stockId]=held-qty;
      if(st.myPortfolio[stockId]===0)delete st.myPortfolio[stockId];
    }
    await fbSet(`stock/holdings/${pid}`,{name:st.name,cash:st.myCash,portfolio:st.myPortfolio});
    st.tradeModal=null;render();
  });
  $('tradeCancel')?.addEventListener('click',()=>{st.tradeModal=null;render();});
  $('tradeOverlay')?.addEventListener('click',e=>{if(e.target.id==='tradeOverlay'){st.tradeModal=null;render();}});
}
function leaveStock(){stopPoll();st.view='progSelect';st.tradeModal=null;render();}

        ${holders.length===0?`<p style="color:#9ca3af;text-align:center;padding:1rem">데이터 없음</p>`:
        holders.map(h=>{
          const totalQ=Object.values(h.portfolio||{}).reduce((a,b)=>a+b,0);
          const invested=(INIT_CASH-(h.cash||INIT_CASH));
          return`<div class="par-row" style="flex-direction:column;align-items:flex-start;gap:6px">
            <div style="display:flex;justify-content:space-between;width:100%">
              <span style="font-weight:700">${esc(h.name)}</span>
              <span style="font-size:13px;color:#6b7280">투자 ₩${fmt(invested)} · 잔여 ₩${fmt(h.cash||0)}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${stocks.map((s,i)=>{const q=h.portfolio?.[s.id]||0;if(!q)return'';
                return`<span style="background:${C[i%C.length]}20;color:${C[i%C.length]};border:1px solid ${C[i%C.length]}40;padding:2px 10px;border-radius:6px;font-size:12px;font-weight:700">${esc(s.name)} ${q}주</span>`;}).join('')}
            </div>
          </div>`;}).join('')}
      </div>
    </div>`;}

  /* 활성 중: 실시간 집계 */
  return`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="font-size:16px;font-weight:800">📊 실시간 투자 현황</h3>
        <span style="font-size:13px;color:#6b7280">총 ${grandTotal}주 거래중</span>
      </div>
      ${stocks.map((s,i)=>{const qty=totalsByStock[s.id]||0;const pct=grandTotal>0?Math.round(qty/grandTotal*100):0;
        return`<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:700">${esc(s.name)}</span><span style="color:#6b7280;font-size:14px">${qty}주 (${pct}%)</span></div>
        <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${C[i%C.length]}">${pct>12?`<span class="bar-pct">${pct}%</span>`:''}</div></div></div>`;}).join('')}
    </div>
    <div class="card">
      <p style="font-size:14px;font-weight:700;margin-bottom:12px">참가자별 현황 <span style="font-weight:400;font-size:13px;color:#6b7280">${holders.length}명 접속</span></p>
      ${holders.map(h=>{const invested=INIT_CASH-(h.cash||INIT_CASH);
        return`<div class="par-row"><span style="font-weight:600">${esc(h.name)}</span><span style="font-size:13px;color:#6b7280">₩${fmt(invested)} 투자</span></div>`;}).join('')}

/* ── 대시보드 이벤트 ── */
function bindDash(){
  $('dashBack')?.addEventListener('click',()=>{stopPoll();st.view='home';render();});
  $('tabVBoard')?.addEventListener('click',()=>{st.dashTab='voteBoard';render();});
  $('tabVFac')?.addEventListener('click',()=>{st.dashTab='voteFac';render();});
  $('tabSBoard')?.addEventListener('click',()=>{st.dashTab='stockBoard';render();});
  $('tabSFac')?.addEventListener('click',()=>{st.dashTab='stockFac';render();});
  /* 투표 */
  $('anonToggle')?.addEventListener('change',async e=>{st.anon=!e.target.checked;await fbSet('session/anon',st.anon);render();});
  $('qInput')?.addEventListener('input',e=>{st.qText=e.target.value;const sb=$('startVoteBtn');if(sb)sb.disabled=!e.target.value.trim();});
  document.querySelectorAll('.preset-btn').forEach(b=>b.addEventListener('click',()=>{st.preset=+b.dataset.preset;render();}));
  $('startVoteBtn')?.addEventListener('click',startVote);
  $('endVoteBtn')?.addEventListener('click',endVote);
  $('resetVoteBtn')?.addEventListener('click',resetVote);
  $('revealBtn')?.addEventListener('click',revealResults);
  /* 주식 */
  $('stockNameInput')?.addEventListener('input',e=>{
    st.newStockInput=e.target.value;
    const ab=$('addStockBtn');if(ab)ab.disabled=!e.target.value.trim();
  });
  $('stockNameInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&st.newStockInput.trim())addStock();});
  $('addStockBtn')?.addEventListener('click',addStock);
  document.querySelectorAll('.stock-item-del').forEach(b=>b.addEventListener('click',()=>removeStock(b.dataset.sid)));
  $('startStockBtn')?.addEventListener('click',startStockGame);
  $('endStockBtn')?.addEventListener('click',endStockGame);
  $('resetStockBtn')?.addEventListener('click',resetStock);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━
   VOTE ACTIONS
━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function countVotes(){
  const counts={};
  if(st.q)st.q.opts.forEach(o=>counts[o]=0);
  let total=0;
  Object.values(st.votes||{}).forEach(v=>{if(v&&st.q&&v.questionId===st.q.id&&counts[v.choice]!==undefined){counts[v.choice]++;total++;}});
  return{counts,total};
}
async function startVote(){
  const text=st.qText.trim();if(!text)return;
  const q={id:Date.now().toString(),text,opts:PRESETS[st.preset].opts,active:true};
  await fbDel('votes');await fbSet('session/q',q);await fbSet('session/revealed',false);
  st.q=q;st.votes={};st.revealed=false;st.justRevealed=false;render();
}
async function endVote(){if(!st.q)return;const q={...st.q,active:false};await fbSet('session/q',q);st.q=q;render();}
async function resetVote(){await fbDel('session');await fbDel('votes');st.q=null;st.votes={};st.qText='';st.revealed=false;st.justRevealed=false;render();}
async function revealResults(){
  await fbSet('session/revealed',true);
  st.justRevealed=true;st.revealed=true;st.dashTab='voteBoard';render();
  setTimeout(()=>{st.justRevealed=false;},1200);
}
async function submitVote(choice){
  if(!st.q||st.myVote||!st.name)return;
  await fbSet(`votes/${pid}`,{questionId:st.q.id,choice,name:st.name,pid});
  st.myVote=choice;render();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━
   STOCK ACTIONS
━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function getSortedStocks(){
  return Object.values(st.stockItems||{}).sort((a,b)=>(a.order||0)-(b.order||0));
}
async function enterStock(){
  st.myCash=INIT_CASH;st.myPortfolio={};
  const existing=await fbGet(`stock/holdings/${pid}`);
  if(existing&&existing.name){st.myCash=existing.cash||INIT_CASH;st.myPortfolio=existing.portfolio||{};}
  else{await fbSet(`stock/holdings/${pid}`,{name:st.name,cash:INIT_CASH,portfolio:{}});}
  st.view='parStock';render();startPoll('stock');
}
async function addStock(){
  const name=st.newStockInput.trim();if(!name)return;
  const id='s'+Date.now();
  const order=Object.keys(st.stockItems||{}).length;
  st.stockItems[id]={id,name,order};
  await fbSet(`stock/items/${id}`,{id,name,order});
  if(st.stockStatus==='idle')await fbSet('stock/status','listing');
  st.stockStatus='listing';st.newStockInput='';render();
}
async function removeStock(id){
  delete st.stockItems[id];
  await fbDel(`stock/items/${id}`);
  if(Object.keys(st.stockItems||{}).length===0){await fbSet('stock/status','idle');st.stockStatus='idle';}
  render();
}
async function startStockGame(){
  await fbSet('stock/status','active');
  st.stockStatus='active';render();
}
async function endStockGame(){
  await fbSet('stock/status','ended');
  st.stockStatus='ended';render();
}
async function resetStock(){
  await fbDel('stock');
  st.stockStatus='idle';st.stockItems={};st.stockOrder=[];st.allHoldings={};st.newStockInput='';render();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━
   POLLING
━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function startPoll(role){
  stopPoll();
  const tick=async()=>{
    if(role==='dash'){
      const q=await fbGet('session/q');
      const v=await fbGet('votes');
      const anon=await fbGet('session/anon');
      const rev=await fbGet('session/revealed');
      const ss=await fbGet('stock/status');
      const si=await fbGet('stock/items');
      const sh=await fbGet('stock/holdings');
      const wasRev=st.revealed;
      const changed=JSON.stringify(q)!==JSON.stringify(st.q)||JSON.stringify(v)!==JSON.stringify(st.votes)
        ||!!anon!==st.anon||!!rev!==st.revealed||ss!==st.stockStatus
        ||JSON.stringify(si)!==JSON.stringify(st.stockItems)||JSON.stringify(sh)!==JSON.stringify(st.allHoldings);
      st.q=q;st.votes=v||{};st.anon=!!anon;
      if(!!rev&&!wasRev){st.justRevealed=true;setTimeout(()=>{st.justRevealed=false;},1200);}
      st.revealed=!!rev;
      if(ss&&ss!==st.stockStatus)st.stockStatus=ss;
      if(si)st.stockItems=si; else st.stockItems={};
      if(sh)st.allHoldings=sh; else st.allHoldings={};
      if(changed)render();
    } else if(role==='par'){
      const q=await fbGet('session/q');
      if(q?.id!==st.q?.id)st.myVote=null;
      const changed=JSON.stringify(q)!==JSON.stringify(st.q);
      st.q=q;if(changed&&!st.myVote)render();
    } else if(role==='stock'){
      const ss=await fbGet('stock/status');
      const si=await fbGet('stock/items');
      const myH=await fbGet(`stock/holdings/${pid}`);
      const changed=ss!==st.stockStatus||JSON.stringify(si)!==JSON.stringify(st.stockItems);
      if(ss)st.stockStatus=ss;
      if(si)st.stockItems=si; else st.stockItems={};
      if(myH){st.myCash=myH.cash||INIT_CASH;st.myPortfolio=myH.portfolio||{};}
      if(changed&&!st.tradeModal)render();
    }
  };
  tick();pollTimer=setInterval(tick,2000);
}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}

/* ━━ INIT ━━━━━━━━━━━━━━━━━ */
render();
</script>
