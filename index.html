<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퍼실리테이션 프로그램</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
      min-height: 100vh;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .view {
      display: none;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .view.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ---------- 참가자 화면 ---------- */
    #participant-view .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 0 10px 40px rgba(0, 64, 151, 0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo-wrap {
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: center;
    }

    .logo-wrap svg {
      width: 100%;
      max-width: 340px;
      height: auto;
    }

    #participant-view h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #004097;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    #participant-view .subtitle {
      font-size: 0.95rem;
      color: #6b7684;
      margin-bottom: 2rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.95rem 1.1rem;
      font-size: 1rem;
      border: 2px solid #e5e8ec;
      border-radius: 12px;
      background: #fafbfc;
      transition: border-color 0.15s, background 0.15s;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #009991;
      background: #ffffff;
    }

    .btn-primary {
      width: 100%;
      padding: 0.95rem 1.1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #004097 0%, #009991 100%);
      color: white;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      font-family: inherit;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(0, 64, 151, 0.25);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ---------- 등록 완료 ---------- */
    .joined-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 0 10px 40px rgba(0, 64, 151, 0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .joined-box .check {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #009991;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 2rem;
    }

    .joined-box h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #004097;
      margin-bottom: 0.5rem;
    }

    .joined-box p {
      color: #6b7684;
      font-size: 0.95rem;
    }

    .joined-box .name-tag {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.5rem 1rem;
      background: #f0f6f5;
      color: #009991;
      border-radius: 999px;
      font-weight: 600;
    }

    /* ---------- 대시보드 / 관리자 공통 ---------- */
    .panel {
      width: 100%;
      max-width: 1200px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 64, 151, 0.06);
      margin-bottom: 1.5rem;
    }

    .panel-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #004097;
    }

    .panel-header .badge {
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-dashboard {
      background: #e8f5f4;
      color: #009991;
    }

    .badge-admin {
      background: #fff4e6;
      color: #c97a1f;
    }

    .panel-body {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      min-height: 60vh;
      box-shadow: 0 4px 16px rgba(0, 64, 151, 0.06);
      color: #6b7684;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
    }

    .panel-body .placeholder-icon {
      font-size: 3rem;
      opacity: 0.4;
    }

    .panel-body .placeholder-text {
      font-size: 0.95rem;
    }

    .btn-back {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      border: 1px solid #e5e8ec;
      border-radius: 8px;
      background: white;
      color: #6b7684;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-back:hover {
      border-color: #009991;
      color: #009991;
    }

    /* 연결 상태 표시 */
    .conn-status {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 100;
    }

    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cbd5e0;
    }

    .conn-status.online .conn-dot {
      background: #009991;
    }

    .conn-status.online {
      color: #009991;
    }

    .conn-status.offline {
      color: #aaa;
    }
  </style>
</head>

              <path fill="#009991" d="M7.03,29.88l-2.33-.36.22-1.45c.11-.73-.08-1.31-.56-1.75-.34-.3-.73-.48-1.18-.56-.64-.1-1.17,0-1.59.29-.42.29-.68.74-.78,1.33l-.43,2.83,6.45.99.2-1.31ZM3.78,28.19l-.18,1.17-1.91-.29.15-.99c.06-.41.18-.69.34-.85.17-.16.41-.21.73-.17.26.04.46.12.59.22.24.2.33.5.27.92Z"/>
              <polygon fill="#009991" points="5.11 50.55 5.1 50.54 9.32 47.49 8.81 46.3 3.69 47.2 3.68 47.19 8.35 45.21 7.86 44.07 1.85 46.62 2.6 48.38 7.57 47.49 7.57 47.49 3.5 50.49 4.25 52.27 10.26 49.72 9.77 48.57 5.11 50.55"/>
              <path fill="#009991" d="M31.64,45.83c-.15-.09-.36-.14-.62-.14s-.46.05-.61.14c-.15.1-.22.22-.22.39s.07.3.22.39c.14.09.35.14.6.14s.47-.05.62-.14c.16-.1.23-.22.23-.39s-.07-.3-.22-.39Z"/>

      </div>
      <h1>퍼실리테이션 프로그램</h1>
      <p class="subtitle">이름을 입력하고 등록해 주세요</p>
      <div class="input-group">
        <input
          type="text"
          id="participant-name"
          placeholder="이름"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >
        <button id="register-btn" class="btn-primary">등록</button>
      </div>
    </div>

    <!-- 등록 완료 후 표시 -->
    <div class="joined-box" id="joined-box" style="display:none;">
      <div class="check">✓</div>
      <h2>등록되었습니다</h2>
      <p>다음 활동을 기다려 주세요</p>
      <div class="name-tag" id="joined-name"></div>
    </div>
  </div>

  <!-- ============ 대시보드 화면 ============ -->
  <div id="dashboard-view" class="view">
    <div class="panel">
      <div class="panel-header">
        <h1>대시보드</h1>
        <span class="badge badge-dashboard">DASHBOARD</span>
      </div>
      <div class="panel-body">
        <div class="placeholder-icon">📊</div>
        <div class="placeholder-text">결과값이 여기 표시됩니다</div>
        <div class="placeholder-text" style="font-size:0.8rem; color:#aaa;">(추후 활동 모듈이 추가될 영역)</div>
      </div>
    </div>
  </div>

  <!-- ============ 관리자 화면 ============ -->
  <div id="admin-view" class="view">
    <div class="panel">
      <div class="panel-header">
        <h1>관리자</h1>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <span class="badge badge-admin">ADMIN</span>
          <button class="btn-back" id="admin-back-btn">참가자 화면</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="placeholder-icon">⚙️</div>
        <div class="placeholder-text">참가자 및 대시보드 관리 영역</div>
        <div class="placeholder-text" style="font-size:0.8rem; color:#aaa;">(추후 활동 제어 기능이 추가될 영역)</div>
      </div>
    </div>
  </div>

  <!-- Firebase 연결 상태 -->
  <div class="conn-status" id="conn-status">
    <div class="conn-dot"></div>
    <span id="conn-text">연결 중...</span>
  </div>

  <!-- ============ Firebase + 로직 ============ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getDatabase, ref, push, onValue, serverTimestamp, set
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ======================================================
    // ⚠️ Firebase 설정: 본인의 Firebase 프로젝트 정보로 교체
    // ======================================================
    const firebaseConfig = {
      // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCb3IMThHdBe73up9s--OPcBfiKMnKrHEw",
  authDomain: "tset2-6c1c6.firebaseapp.com",
  databaseURL: "https://tset2-6c1c6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tset2-6c1c6",
  storageBucket: "tset2-6c1c6.firebasestorage.app",
  messagingSenderId: "342313733951",
  appId: "1:342313733951:web:c25c701ad47e6a4c6a0d8a"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
    };

    let db = null;
    let firebaseReady = false;

    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      firebaseReady = true;

      // 연결 상태 감지
      const connRef = ref(db, ".info/connected");
      onValue(connRef, (snap) => {
        const connected = snap.val() === true;
        setConnStatus(connected);
      });
    } catch (e) {
      console.warn("Firebase 초기화 실패:", e);
      setConnStatus(false, "Firebase 미설정");
    }

    function setConnStatus(online, customText) {
      const el = document.getElementById("conn-status");
      const txt = document.getElementById("conn-text");
      if (online) {
        el.classList.add("online");
        el.classList.remove("offline");
        txt.textContent = "연결됨";
      } else {
        el.classList.remove("online");
        el.classList.add("offline");
        txt.textContent = customText || "오프라인";
      }
    }

    // ======================================================
    // View 전환
    // ======================================================
    function showView(viewId) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById(viewId).classList.add("active");
    }

    // ======================================================
    // 참가자 등록 핸들러
    // ======================================================
    const nameInput = document.getElementById("participant-name");
    const registerBtn = document.getElementById("register-btn");

    function handleRegister() {
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.focus();
        return;
      }

      // 특수 트리거: 관리자 / 대시보드
      if (name === "관리자!") {
        nameInput.value = "";
        showView("admin-view");
        return;
      }
      if (name === "대시보드!") {
        nameInput.value = "";
        showView("dashboard-view");
        return;
      }

      // 일반 참가자 등록
      if (firebaseReady && db) {
        const participantsRef = ref(db, "participants");
        push(participantsRef, {
          name: name,
          joinedAt: serverTimestamp()
        }).then(() => {
          showJoined(name);
        }).catch((err) => {
          console.error("등록 실패:", err);
          // Firebase 실패해도 일단 등록 완료 화면은 표시 (로컬 폴백)
          showJoined(name);
        });
      } else {
        // Firebase 미설정 시 로컬 폴백
        showJoined(name);
      }
    }

    function showJoined(name) {
      document.getElementById("participant-card").style.display = "none";
      const joinedBox = document.getElementById("joined-box");
      document.getElementById("joined-name").textContent = name;
      joinedBox.style.display = "block";
    }

    registerBtn.addEventListener("click", handleRegister);
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleRegister();
      }
    });

    // ======================================================
    // 관리자: 참가자 화면으로 돌아가기
    // ======================================================
    document.getElementById("admin-back-btn").addEventListener("click", () => {
      // 참가자 화면 초기 상태로
      document.getElementById("participant-card").style.display = "";
      document.getElementById("joined-box").style.display = "none";
      nameInput.value = "";
      showView("participant-view");
    });

    // 초기 포커스
    setTimeout(() => nameInput.focus(), 100);
  </script>
</body>
</html>
