<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼실리테이션 시스템</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f0f2f5;min-height:100vh;color:#111827;}
.page{min-height:100vh;display:flex;flex-direction:column;}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 2px 16px rgba(0,0,0,.07);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1;}
.btn:hover{filter:brightness(.91);}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none;}
.btn-indigo{background:#4f46e5;color:#fff;}
.btn-green{background:#059669;color:#fff;}
.btn-red{background:#e11d48;color:#fff;}
.btn-blue{background:#2563eb;color:#fff;}
.btn-orange{background:#ea580c;color:#fff;}
.btn-gray{background:#f3f4f6;color:#374151;}
.btn-dark{background:#1e293b;color:#fff;}
.btn-purple{background:#7c3aed;color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:16px 20px;font-size:16px;}
textarea,input[type=text]{width:100%;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;background:#fafafa;color:#111827;resize:vertical;}
textarea:focus,input[type=text]:focus{border-color:#4f46e5;background:#fff;}
.tab-wrap{display:flex;gap:3px;background:#f3f4f6;padding:4px;border-radius:10px;flex-wrap:wrap;}
.tab{flex:1;min-width:60px;padding:7px 8px;border:none;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;background:transparent;color:#6b7280;transition:all .15s;white-space:nowrap;text-align:center;}
.tab.on{background:#fff;color:#111827;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.badge-live{background:#dcfce7;color:#15803d;}
.badge-end{background:#f3f4f6;color:#6b7280;}
.badge-prep{background:#fef3c7;color:#92400e;}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.preset-btn{padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;line-height:1.4;}
.preset-btn.on{border-color:#4f46e5;background:#eef2ff;color:#3730a3;font-weight:700;}
.bar-wrap{height:40px;background:#f3f4f6;border-radius:10px;overflow:hidden;}
.bar-fill{height:100%;border-radius:10px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;transition:width .7s ease;}
.bar-pct{color:#fff;font-size:13px;font-weight:700;}
.stat{border-radius:12px;padding:14px;text-align:center;flex:1;min-width:76px;}
.stat-num{font-size:38px;font-weight:800;line-height:1;}
.stat-label{font-size:13px;margin-top:5px;font-weight:600;}
.stat-sub{font-size:12px;margin-top:2px;}
.vote-btn{width:100%;padding:18px;border:none;border-radius:13px;font-size:19px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;transition:all .2s;display:block;margin-bottom:12px;}
.vote-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.2);}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:999px;transition:.25s;}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s;}
.toggle input:checked+.toggle-slider{background:#4f46e5;}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);}
.par-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:#f9fafb;margin-bottom:6px;border:1px solid #f3f4f6;}
.choice-pill{padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;}
.pin-box{display:flex;gap:14px;justify-content:center;margin:20px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #d1d5db;transition:all .15s;}
.pin-dot.filled{background:#4f46e5;border-color:#4f46e5;}
.pin-dot.error{background:#ef4444;border-color:#ef4444;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.num-btn{padding:16px;border:1.5px solid #e5e7eb;border-radius:12px;background:#fff;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;color:#111827;}
.num-btn:hover{background:#f3f4f6;}
.num-btn:active{transform:scale(.93);background:#eef2ff;border-color:#4f46e5;}
/* MTS */
.mts-wrap{min-height:100vh;background:#0d1117;display:flex;flex-direction:column;color:#fff;}
.mts-header{background:#161b27;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e2a3a;}
.mts-title{font-size:17px;font-weight:800;}
.mts-tabs{display:flex;border-bottom:1px solid #1e2a3a;}
.mts-tab{flex:1;padding:11px 8px;text-align:center;font-size:13px;color:#6b7280;border:none;background:none;cursor:pointer;font-family:inherit;font-weight:500;border-bottom:2px solid transparent;transition:all .15s;}
.mts-tab.on{color:#fff;border-bottom-color:#2563eb;font-weight:700;}
.mts-summary{background:#161b27;padding:14px 16px;border-bottom:1px solid #1e2a3a;}
.mts-summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.mts-label{font-size:12px;color:#6b7280;}
.mts-val{font-size:14px;font-weight:700;}
.mts-val-red{color:#f87171;}
.mts-val-blue{color:#60a5fa;}
.mts-val-white{color:#fff;}
.mts-table-header{display:grid;grid-template-columns:1fr 70px 80px 56px 56px;padding:8px 14px;background:#0d1117;border-bottom:1px solid #1e2a3a;}
.mts-th{font-size:11px;color:#6b7280;font-weight:600;text-align:right;}
.mts-th:first-child{text-align:left;}
.mts-row{display:grid;grid-template-columns:1fr 70px 80px 56px 56px;padding:12px 14px;border-bottom:1px solid #0d1117;align-items:center;background:#161b27;}
.mts-stock-name{font-size:13px;font-weight:700;color:#fff;}
.mts-stock-sub{font-size:11px;color:#6b7280;margin-top:2px;}
.mts-cell{font-size:13px;text-align:right;color:#fff;}
.mts-cell-blue{color:#60a5fa;font-weight:700;}
.mts-btn-buy{background:#e11d48;color:#fff;border:none;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.mts-btn-sell{background:#2563eb;color:#fff;border:none;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.mts-btn-buy:disabled,.mts-btn-sell:disabled{opacity:.3;cursor:not-allowed;}
.mts-bottom{background:#161b27;padding:10px 16px;border-top:1px solid #1e2a3a;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6b7280;}
.mts-bottom b{color:#f59e0b;font-size:13px;}
.port-bar-bg{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:6px;}
.port-bar-fill{height:100%;border-radius:999px;transition:width .8s ease;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;}
.modal-sheet{background:#161b27;width:100%;border-radius:20px 20px 0 0;padding:1.5rem;color:#fff;max-width:500px;margin:0 auto;}
.modal-title{font-size:16px;font-weight:800;}
.modal-sub{font-size:13px;color:#6b7280;margin-top:2px;margin-bottom:20px;}
.qty-row{display:flex;align-items:center;gap:12px;justify-content:center;margin:16px 0;}
.qty-btn{width:46px;height:46px;border:1.5px solid #334155;border-radius:10px;background:#0d1117;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:700;flex-shrink:0;}
.qty-btn:disabled{opacity:.3;cursor:not-allowed;}
.qty-input{font-size:32px;font-weight:800;width:90px;text-align:center;background:#0d1117;border:1.5px solid #334155;border-radius:10px;color:#fff;outline:none;font-family:inherit;padding:6px 0;}
.qty-input:focus{border-color:#4f46e5;}
.qty-info{background:#0d1117;border-radius:10px;padding:12px 16px;margin:12px 0;}
.qty-info-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.qty-info-row:last-child{margin-bottom:0;}
.modal-confirm-buy{width:100%;padding:15px;background:#e11d48;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;}
.modal-confirm-sell{width:100%;padding:15px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;}
.modal-confirm-buy:disabled,.modal-confirm-sell:disabled{opacity:.4;cursor:not-allowed;}
.modal-cancel{width:100%;padding:12px;background:#1e293b;color:#94a3b8;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;}
/* Stock admin */
.stock-item-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f9fafb;border-radius:10px;margin-bottom:8px;border:1px solid #f3f4f6;}
.stock-item-name{flex:1;font-weight:600;font-size:14px;}
.stock-item-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:18px;padding:2px 6px;}
/* Blind */
.blind-screen{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);border-radius:16px;padding:3rem 2rem;text-align:center;color:#fff;}
.blind-orb{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:52px;border:2px solid rgba(255,255,255,.15);}
.vdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#a5b4fc;margin:0 3px;}
.vdot:nth-child(1){animation:pulse 1.2s .0s ease-in-out infinite;}
.vdot:nth-child(2){animation:pulse 1.2s .2s ease-in-out infinite;}
.vdot:nth-child(3){animation:pulse 1.2s .4s ease-in-out infinite;}
.btn-reveal{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-size:15px;padding:13px 26px;border-radius:12px;box-shadow:0 4px 20px rgba(239,68,68,.35);border:none;cursor:pointer;font-family:inherit;font-weight:800;display:inline-flex;align-items:center;gap:10px;transition:all .2s;}
.btn-reveal:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(239,68,68,.45);}
/* Prog card */
.prog-card{background:#fff;border-radius:16px;padding:1.5rem;box-shadow:0 2px 16px rgba(0,0,0,.07);border:2px solid transparent;cursor:pointer;transition:all .2s;}
.prog-card:hover{border-color:#4f46e5;transform:translateY(-3px);box-shadow:0 8px 24px rgba(79,70,229,.15);}
/* WHO AM I */
.who-mystery-card{background:linear-gradient(135deg,#1e1b4b,#312e81);border-radius:16px;padding:2rem;text-align:center;color:#fff;margin-bottom:14px;}
.who-keyword-tag{display:inline-block;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;margin:3px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#e2e8f0;}
.who-candidate-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f9fafb;border-radius:10px;margin-bottom:8px;border:1px solid #f3f4f6;}
.who-candidate-name{flex:1;font-weight:600;font-size:14px;}
.who-nav-btn{padding:10px 20px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.who-nav-btn:hover{background:#f3f4f6;}
.who-nav-btn:disabled{opacity:.3;cursor:not-allowed;}
/* Animations */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease;}
@keyframes revealPop{0%{opacity:0;transform:scale(.92) translateY(16px)}60%{transform:scale(1.03) translateY(-3px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.reveal-pop{animation:revealPop .55s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes barGrow{from{width:0!important}to{}}
.bar-reveal{animation:barGrow .8s cubic-bezier(.34,1.2,.64,1) both;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.slide-up{animation:slideUp .3s ease;}
@media(max-width:580px){
  .preset-grid{grid-template-columns:1fr;}
  .stat-num{font-size:32px;}
  .mts-table-header,.mts-row{grid-template-columns:1fr 56px 70px 50px 50px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ━━━━━━━━━━━━━━━━━━━━━━
   CONFIG
━━━━━━━━━━━━━━━━━━━━━━ */
const DB='https://test01-53af5-default-rtdb.asia-southeast1.firebasedatabase.app';
const PASSCODE='1234';
const SHARE_PRICE=10000;
const INIT_CASH=1000000;
const WHO_COUNT=5;

const C=['#4f46e5','#22c55e','#ef4444','#f59e0b','#8b5cf6','#0ea5e9','#ec4899','#14b8a6'];
const PRESETS=[
  {label:'찬성 / 반대 / 중립',opts:['찬성','반대','중립']},
  {label:'찬성 / 반대',opts:['찬성','반대']},
  {label:'매우찬성 / 찬성 / 반대 / 매우반대',opts:['매우 찬성','찬성','반대','매우 반대']},
  {label:'동의 / 불동의 / 보류',opts:['동의','불동의','보류']},
];

/* ━━ Firebase ━━━━━━━━━━━━ */
async function fbGet(p){try{const r=await fetch(`${DB}/${p}.json`);return await r.json();}catch{return null;}}
async function fbSet(p,d){try{await fetch(`${DB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch{}}
async function fbDel(p){try{await fetch(`${DB}/${p}.json`,{method:'DELETE'});}catch{}}

/* ━━ 상태 ━━━━━━━━━━━━━━━━ */
const pid='p'+Math.random().toString(36).substr(2,9);
const st={
  view:'home', dashTab:'voteBoard',
  nameInput:'', name:'',
  pinInput:'', pinError:false,
  // 투표
  preset:0, qText:'', q:null, votes:{}, anon:false, revealed:false, justRevealed:false, myVote:null,
  // 주식
  stockStatus:'idle', stockItems:{}, myCash:INIT_CASH, myPortfolio:{}, allHoldings:{},
  newStockInput:'', mtsTab:'holdings', tradeModal:null,
  // 나는 누구?
  whoStatus:'idle',
  whoParticipants:{}, whoSelected:[],
  whoCurrentSubject:0, whoCandidates:{}, whoVotingOpen:false,
  whoVotes:{}, whoRevealed:false, whoKeywords:{}, whoParticipantsDone:{},
  // 나는 누구? 참가자 로컬
  whoCurrentCard:0, whoKeywordDrafts:{}, whoSubmitted:{}, whoMyVote:null,
};
let pollTimer=null;

/* ━━ 유틸 ━━━━━━━━━━━━━━━━ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
function fmt(n){return Number(n||0).toLocaleString('ko-KR');}

/* ━━━━━━━━━━━━━━━━━━━━━━
   RENDER  (focus 복원)
━━━━━━━━━━━━━━━━━━━━━━ */
function render(){
  const fa=document.activeElement;
  const fid=fa?.id; const fss=fa?.selectionStart; const fse=fa?.selectionEnd;
  const app=$('app');
  switch(st.view){
    case 'home':       app.innerHTML=homeHTML();       bindHome();break;
    case 'lock':       app.innerHTML=lockHTML();       bindLock();break;
    case 'progSelect': app.innerHTML=progSelectHTML(); bindProgSelect();break;
    case 'parVote':    app.innerHTML=parVoteHTML();    bindParVote();break;
    case 'parStock':   app.innerHTML=parStockHTML();   bindParStock();break;
    case 'parWho':     app.innerHTML=parWhoHTML();     bindParWho();break;
    case 'dash':       app.innerHTML=dashHTML();       bindDash();break;
  }
  // 포커스 복원
  if(fid){
    const el=$(fid);
    if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){
      el.focus();
      try{el.setSelectionRange(fss,fse);}catch{}
    }
  }
}

/* ══════════════════════
   HOME
══════════════════════ */
function homeHTML(){return`
<div class="page" style="background:linear-gradient(135deg,#eef2ff 0%,#f0f9ff 100%)">
<div class="center"><div class="card fade-in" style="max-width:420px;width:100%;text-align:center;padding:2.75rem">
  <div style="font-size:52px;margin-bottom:14px">🎯</div>
  <h1 style="font-size:22px;font-weight:800;margin-bottom:6px">퍼실리테이션 시스템</h1>
  <p style="color:#6b7280;font-size:14px;margin-bottom:36px">역할을 선택해주세요</p>
  <div style="display:flex;flex-direction:column;gap:14px">
    <button class="btn btn-green btn-block btn-lg" id="btnPar" style="font-size:17px;padding:18px">🙋 참가자로 참여하기</button>
    <button class="btn btn-indigo btn-block btn-lg" id="btnDash" style="font-size:17px;padding:18px">📊 대시보드 현황판</button>
  </div>
  <p style="font-size:12px;color:#9ca3af;margin-top:28px">같은 링크에서 역할만 다르게 선택하세요</p>
</div></div></div>`;}
function bindHome(){
  $('btnPar')?.addEventListener('click',()=>{st.view='progSelect';render();});
  $('btnDash')?.addEventListener('click',()=>{st.pinInput='';st.pinError=false;st.view='lock';render();});
}

/* ══════════════════════
   LOCK
══════════════════════ */
function lockHTML(){
  const f=st.pinInput.length;
  const dots=[0,1,2,3].map(i=>`<div class="pin-dot ${f>i?(st.pinError?'error':'filled'):''}"></div>`).join('');
  const nums=['1','2','3','4','5','6','7','8','9','','0','←'];
  return`
<div class="page" style="background:linear-gradient(135deg,#eef2ff 0%,#f0f9ff 100%)">
<div class="center">
  <button class="btn btn-gray" id="lockBack" style="position:fixed;top:16px;left:16px;font-size:13px">← 뒤로</button>
  <div class="card fade-in" style="max-width:320px;width:100%;text-align:center;padding:2rem">
    <div style="font-size:40px;margin-bottom:10px">🔐</div>
    <h2 style="font-size:18px;font-weight:800;margin-bottom:4px">보안코드 입력</h2>
    <p style="font-size:13px;color:#6b7280;margin-bottom:2px">대시보드 전용 화면</p>
    <p style="font-size:13px;height:20px;color:#ef4444;font-weight:600;margin-top:4px">${st.pinError?'코드가 올바르지 않습니다':''}</p>
    <div class="pin-box">${dots}</div>
    <div class="numpad">${nums.map(n=>`<button class="num-btn" data-n="${n}" ${n===''?'style="visibility:hidden"':''}>${n}</button>`).join('')}</div>
  </div>
</div></div>`;}
function bindLock(){
  $('lockBack')?.addEventListener('click',()=>{st.view='home';render();});
  document.querySelectorAll('.num-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const n=b.dataset.n;
      if(n==='←'){st.pinInput=st.pinInput.slice(0,-1);st.pinError=false;render();return;}
      if(n===''||st.pinInput.length>=4)return;
      st.pinInput+=n;render();
      if(st.pinInput.length===4){
        if(st.pinInput===PASSCODE){st.pinInput='';st.pinError=false;st.view='dash';render();startPoll('dash');}
        else{st.pinError=true;render();setTimeout(()=>{st.pinInput='';st.pinError=false;render();},900);}
      }
    });
  });
}

/* ══════════════════════
   PROGRAM SELECT
══════════════════════ */
function progSelectHTML(){
  if(!st.name)return`

function tradeModalHTML(){
  if(!st.tradeModal)return'';
  const{stockId,type,qty}=st.tradeModal;
  const s=st.stockItems[stockId];if(!s)return'';
  const isBuy=type==='buy';
  const maxBuy=Math.floor(st.myCash/SHARE_PRICE);
  const maxSell=st.myPortfolio[stockId]||0;
  const maxQty=isBuy?maxBuy:maxSell;
  const total=qty*SHARE_PRICE;
  return`
<div class="modal-overlay" id="tradeOverlay">
<div class="modal-sheet slide-up">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><div class="modal-title">${esc(s.name)}</div><div class="modal-sub">${isBuy?'매수':'매도'} · 1주당 ₩${fmt(SHARE_PRICE)}</div></div>
    <span style="${isBuy?'background:#e11d4820;color:#e11d48':'background:#2563eb20;color:#2563eb'};padding:4px 12px;border-radius:8px;font-size:13px;font-weight:700">${isBuy?'매수':'매도'}</span>
  </div>
  <div class="qty-row">
    <button class="qty-btn" id="qtyMinus" ${qty<=0?'disabled':''}>−</button>
    <input class="qty-input" type="number" id="qtyInput" min="0" max="${maxQty}" value="${qty}">
    <button class="qty-btn" id="qtyPlus" ${qty>=maxQty?'disabled':''}>+</button>
  </div>
  <div class="qty-info">
    <div class="qty-info-row"><span style="color:#94a3b8">주문 금액</span><span id="tradeTotal" style="font-weight:700;color:#fff">₩${fmt(total)}</span></div>
    ${isBuy?`
    <div class="qty-info-row"><span style="color:#94a3b8">주문 후 잔여</span><span id="tradeAfterCash" style="color:#60a5fa;font-weight:700">₩${fmt(st.myCash-total)}</span></div>
    <div class="qty-info-row" style="margin:0"><span style="color:#94a3b8">최대 매수</span><span style="color:#94a3b8">${maxBuy}주</span></div>`:
    `<div class="qty-info-row" style="margin:0"><span style="color:#94a3b8">보유수량</span><span style="color:#94a3b8">${maxSell}주</span></div>`}
  </div>
  <button class="${isBuy?'modal-confirm-buy':'modal-confirm-sell'}" id="tradeConfirm" ${qty===0?'disabled':''}>
    ${isBuy?`📈 ${qty}주 매수 확정`:`📉 ${qty}주 매도 확정`}
  </button>
  <button class="modal-cancel" id="tradeCancel">취소</button>
</div></div>`;}

/* 모달 수량만 in-place 업데이트 (render 호출 없음) */
function updateModalUI(){
  const m=st.tradeModal;if(!m)return;
  const isBuy=m.type==='buy';
  const total=m.qty*SHARE_PRICE;
  const maxBuy=Math.floor(st.myCash/SHARE_PRICE);
  const maxSell=st.myPortfolio[m.stockId]||0;
  const maxQty=isBuy?maxBuy:maxSell;
  const qi=$('qtyInput');if(qi&&document.activeElement!==qi)qi.value=m.qty;
  const minus=$('qtyMinus');const plus=$('qtyPlus');
  if(minus)minus.disabled=m.qty<=0;
  if(plus)plus.disabled=m.qty>=maxQty;
  const totalEl=$('tradeTotal');if(totalEl)totalEl.textContent=`₩${fmt(total)}`;
  if(isBuy){const ae=$('tradeAfterCash');if(ae)ae.textContent=`₩${fmt(st.myCash-total)}`;}
  const cb=$('tradeConfirm');
  if(cb){cb.disabled=m.qty===0;cb.innerHTML=isBuy?`📈 ${m.qty}주 매수 확정`:`📉 ${m.qty}주 매도 확정`;}
}

function bindParStock(){
  document.querySelectorAll('.mts-btn-buy,.mts-btn-sell').forEach(b=>{
    b.addEventListener('click',()=>{st.tradeModal={stockId:b.dataset.sid,type:b.dataset.type,qty:1};render();});
  });
  $('mtsTabH')?.addEventListener('click',()=>{st.mtsTab='holdings';render();});
  $('mtsTabP')?.addEventListener('click',()=>{st.mtsTab='portfolio';render();});
  bindTradeModal();
}
function bindTradeModal(){
  if(!st.tradeModal)return;
  const{type,stockId}=st.tradeModal;
  const maxBuy=Math.floor(st.myCash/SHARE_PRICE);
  const maxSell=st.myPortfolio[stockId]||0;
  const maxQty=type==='buy'?maxBuy:maxSell;
  $('qtyMinus')?.addEventListener('click',()=>{if(st.tradeModal.qty>0){st.tradeModal.qty--;updateModalUI();}});
  $('qtyPlus')?.addEventListener('click',()=>{if(st.tradeModal.qty<maxQty){st.tradeModal.qty++;updateModalUI();}});
  $('qtyInput')?.addEventListener('input',e=>{
    let v=parseInt(e.target.value)||0;v=Math.max(0,Math.min(v,maxQty));
    st.tradeModal.qty=v;
    const total=v*SHARE_PRICE;
    const cb=$('tradeConfirm');if(cb){cb.disabled=v===0;cb.innerHTML=type==='buy'?`📈 ${v}주 매수 확정`:`📉 ${v}주 매도 확정`;}
    const te=$('tradeTotal');if(te)te.textContent=`₩${fmt(total)}`;
    if(type==='buy'){const ae=$('tradeAfterCash');if(ae)ae.textContent=`₩${fmt(st.myCash-total)}`;}
  });
  $('qtyInput')?.addEventListener('blur',e=>{
    let v=parseInt(e.target.value)||0;v=Math.max(0,Math.min(v,maxQty));
    st.tradeModal.qty=v;e.target.value=v;updateModalUI();
  });
  $('tradeConfirm')?.addEventListener('click',async()=>{
    const{stockId,type,qty}=st.tradeModal;if(qty===0)return;
    if(type==='buy'){const cost=qty*SHARE_PRICE;if(st.myCash<cost)return;st.myCash-=cost;st.myPortfolio[stockId]=(st.myPortfolio[stockId]||0)+qty;}
    else{const held=st.myPortfolio[stockId]||0;if(held<qty)return;st.myCash+=qty*SHARE_PRICE;st.myPortfolio[stockId]=held-qty;if(!st.myPortfolio[stockId])delete st.myPortfolio[stockId];}
    await fbSet(`stock/holdings/${pid}`,{name:st.name,cash:st.myCash,portfolio:st.myPortfolio});
    st.tradeModal=null;render();
  });
  $('tradeCancel')?.addEventListener('click',()=>{st.tradeModal=null;render();});
  $('tradeOverlay')?.addEventListener('click',e=>{if(e.target.id==='tradeOverlay'){st.tradeModal=null;render();}});
}
function leaveStock(){stopPoll();st.view='progSelect';st.tradeModal=null;render();}

  // 종료
  return`<div class="page center" style="background:#f0f2f5">${back}
  <div style="text-align:center" class="fade-in">
    <div style="font-size:54px;margin-bottom:18px">🎉</div>
    <h2 style="font-size:20px;font-weight:800;margin-bottom:8px">게임 종료!</h2>

function bindParWho(){
  $('parWhoBack')?.addEventListener('click',()=>{stopPoll();st.view='progSelect';render();});
  const kwIn=$('whoKwInput');
  if(kwIn){
    const myCards=st.whoSelected.filter(p=>p!==pid);
    const targetPid=myCards[Math.min(st.whoCurrentCard,myCards.length-1)];
    kwIn.addEventListener('input',e=>{
      st.whoKeywordDrafts[targetPid]=e.target.value;
      const sb=$('whoSubmitKw');if(sb)sb.disabled=!e.target.value.trim();
    });
  }
  $('whoSubmitKw')?.addEventListener('click',async()=>{
    const myCards=st.whoSelected.filter(p=>p!==pid);
    const targetPid=myCards[Math.min(st.whoCurrentCard,myCards.length-1)];
    const kw=st.whoKeywordDrafts[targetPid]||'';
    if(!kw.trim())return;
    await fbSet(`who/keywords/${targetPid}/${pid}`,kw);
    st.whoSubmitted[targetPid]=true;
    // 다음 카드로 자동 이동
    if(st.whoCurrentCard<myCards.length-1)st.whoCurrentCard++;
    render();
  });
  $('whoEditKw')?.addEventListener('click',()=>{
    const myCards=st.whoSelected.filter(p=>p!==pid);
    const targetPid=myCards[Math.min(st.whoCurrentCard,myCards.length-1)];
    delete st.whoSubmitted[targetPid];render();
  });
  $('whoPrev')?.addEventListener('click',()=>{if(st.whoCurrentCard>0){st.whoCurrentCard--;render();}});
  $('whoNext')?.addEventListener('click',()=>{
    const myCards=st.whoSelected.filter(p=>p!==pid);
    if(st.whoCurrentCard<myCards.length-1){st.whoCurrentCard++;render();}
  });
  $('whoRegister')?.addEventListener('click',async()=>{
    await fbSet(`who/participantsDone/${pid}`,true);render();
  });
  // WHO 투표
  document.querySelectorAll('[data-wpid]').forEach(b=>{
    b.addEventListener('click',async()=>{
      const targetPid=b.dataset.wpid;
      await fbSet(`who/votes/${pid}`,targetPid);
      st.whoMyVote=targetPid;render();
    });
  });
}

    <div class="card"><h3 style="font-size:15px;font-weight:700;margin-bottom:12px">참가자별 포트폴리오</h3>

/* ── 나는 누구? 현황판 ── */

      ${kwTags.length>0?kwTags.map(k=>`<span class="who-keyword-tag">${esc(k)}</span>`).join(''):`<span style="opacity:.4;font-size:14px">키워드가 없습니다</span>`}

      <span style="font-size:14px;opacity:.7">${st.whoCurrentSubject+1} / ${st.whoSelected.length}</span>
      <button class="who-nav-btn" id="whoSubNext" style="color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1)" ${st.whoCurrentSubject>=st.whoSelected.length-1?'disabled':''}>다음 →</button>
    </div>
    ${st.whoRevealed?`<div style="margin-top:16px;background:rgba(255,255,255,.15);border-radius:12px;padding:12px 24px;display:inline-block"><p style="font-size:12px;opacity:.7;margin-bottom:4px">정답</p><p style="font-size:24px;font-weight:800">${esc(st.whoParticipants[subjectPid]||'?')}</p></div>`:''}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="font-size:15px;font-weight:800">투표 후보 관리</h3>
      ${st.whoVotingOpen?'<span class="badge badge-live">● 투표 중</span>':''}
    </div>
    <div style="margin-bottom:12px">
      ${allParticipants.map(([p,name])=>{
        const isActive=!!st.whoCandidates?.[p];
        return`<div class="who-candidate-row">
          <span class="who-candidate-name">${esc(name)}</span>
          ${st.whoVotingOpen?`<span style="font-size:13px;color:#6b7280">${voteCounts[p]||0}표</span>`:''}
          ${!st.whoVotingOpen?`<button class="btn ${isActive?'btn-red':'btn-green'}" data-cpid="${p}" id="candBtn_${p}" style="padding:6px 12px;font-size:13px">${isActive?'✕ 제외':'+ 후보 등록'}</button>`:''}

    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${!st.whoVotingOpen&&cands.length>0?`<button class="btn btn-indigo" id="whoOpenVote" style="flex:1">🗳️ 등록 마감 · 투표 시작</button>`:''}

    </div>
    ${st.whoVotingOpen&&totalVotes>0?`<div style="margin-top:14px"><p style="font-size:13px;font-weight:700;color:#6b7280;margin-bottom:10px">실시간 투표 결과 (${totalVotes}명)</p>
      ${cands.map((p,i)=>{const cnt=voteCounts[p]||0;const pct=totalVotes>0?Math.round(cnt/totalVotes*100):0;return`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-weight:600">${esc(st.whoParticipants[p]||'?')}</span><span style="color:#6b7280;font-size:13px">${cnt}표 (${pct}%)</span></div>

      </div>`;}).join('')}

/* ━━━━━━━━━━━━━━━━━━━━━━
   DASHBOARD BIND
━━━━━━━━━━━━━━━━━━━━━━ */
function bindDash(){
  $('dashBack')?.addEventListener('click',()=>{stopPoll();st.view='home';render();});
  $('tabVB')?.addEventListener('click',()=>{st.dashTab='voteBoard';render();});
  $('tabVF')?.addEventListener('click',()=>{st.dashTab='voteFac';render();});
  $('tabSB')?.addEventListener('click',()=>{st.dashTab='stockBoard';render();});
  $('tabSF')?.addEventListener('click',()=>{st.dashTab='stockFac';render();});
  $('tabWB')?.addEventListener('click',()=>{st.dashTab='whoBoard';render();});
  $('tabWF')?.addEventListener('click',()=>{st.dashTab='whoFac';render();});
  // 투표
  $('anonToggle')?.addEventListener('change',async e=>{st.anon=!e.target.checked;await fbSet('session/anon',st.anon);render();});
  $('qInput')?.addEventListener('input',e=>{st.qText=e.target.value;const sb=$('startVoteBtn');if(sb)sb.disabled=!e.target.value.trim();});
  document.querySelectorAll('.preset-btn').forEach(b=>b.addEventListener('click',()=>{st.preset=+b.dataset.preset;render();}));
  $('startVoteBtn')?.addEventListener('click',startVote);
  $('endVoteBtn')?.addEventListener('click',endVote);
  $('resetVoteBtn')?.addEventListener('click',resetVote);
  $('revealBtn')?.addEventListener('click',revealResults);
  // 주식
  $('stockNameInput')?.addEventListener('input',e=>{st.newStockInput=e.target.value;const ab=$('addStockBtn');if(ab)ab.disabled=!e.target.value.trim();});
  $('stockNameInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&st.newStockInput.trim())addStock();});
  $('addStockBtn')?.addEventListener('click',addStock);
  document.querySelectorAll('.stock-item-del').forEach(b=>b.addEventListener('click',()=>removeStock(b.dataset.sid)));
  $('startStockBtn')?.addEventListener('click',startStockGame);
  $('endStockBtn')?.addEventListener('click',endStockGame);
  $('resetStockBtn')?.addEventListener('click',resetStock);
  // 나는 누구?
  $('whoStartBtn')?.addEventListener('click',startWhoGame);
  $('whoEndCollect')?.addEventListener('click',endWhoCollect);
  $('whoResetBtn')?.addEventListener('click',resetWho);
  $('whoSubPrev')?.addEventListener('click',()=>{if(st.whoCurrentSubject>0){st.whoCurrentSubject--;st.whoRevealed=false;st.whoCandidates={};st.whoVotingOpen=false;st.whoVotes={};fbSet('who/currentSubject',st.whoCurrentSubject);fbSet('who/candidates',{});fbSet('who/votingOpen',false);fbSet('who/votes',null);fbSet('who/revealed',false);render();}});
  $('whoSubNext')?.addEventListener('click',()=>{if(st.whoCurrentSubject<st.whoSelected.length-1){st.whoCurrentSubject++;st.whoRevealed=false;st.whoCandidates={};st.whoVotingOpen=false;st.whoVotes={};fbSet('who/currentSubject',st.whoCurrentSubject);fbSet('who/candidates',{});fbSet('who/votingOpen',false);fbSet('who/votes',null);fbSet('who/revealed',false);render();}});
  document.querySelectorAll('[id^="candBtn_"]').forEach(b=>{
    b.addEventListener('click',async()=>{
      const p=b.dataset.cpid;
      st.whoCandidates[p]=!st.whoCandidates[p];
      await fbSet('who/candidates',st.whoCandidates);render();
    });
  });
  $('whoOpenVote')?.addEventListener('click',async()=>{
    st.whoVotingOpen=true;st.whoVotes={};
    await fbSet('who/votingOpen',true);await fbSet('who/votes',null);
    await fbSet('who/status','voting');st.whoStatus='voting';render();
  });
  $('whoCloseVote')?.addEventListener('click',async()=>{
    st.whoVotingOpen=false;await fbSet('who/votingOpen',false);
    await fbSet('who/status','ended');st.whoStatus='ended';render();
  });
  $('whoRevealAnswer')?.addEventListener('click',async()=>{st.whoRevealed=true;await fbSet('who/revealed',true);render();});
  $('whoNextSubject')?.addEventListener('click',()=>{$('whoSubNext')?.click();});
}

/* ━━━━━━━━━━━━━━━━━━━━━━
   VOTE ACTIONS
━━━━━━━━━━━━━━━━━━━━━━ */
function countVotes(){
  const counts={};if(st.q)st.q.opts.forEach(o=>counts[o]=0);let total=0;
  Object.values(st.votes||{}).forEach(v=>{if(v&&st.q&&v.questionId===st.q.id&&counts[v.choice]!==undefined){counts[v.choice]++;total++;}});
  return{counts,total};}
async function startVote(){
  const text=st.qText.trim();if(!text)return;
  const q={id:Date.now().toString(),text,opts:PRESETS[st.preset].opts,active:true};
  await fbDel('votes');await fbSet('session/q',q);await fbSet('session/revealed',false);
  st.q=q;st.votes={};st.revealed=false;st.justRevealed=false;render();}
async function endVote(){if(!st.q)return;const q={...st.q,active:false};await fbSet('session/q',q);st.q=q;render();}
async function resetVote(){await fbDel('session');await fbDel('votes');st.q=null;st.votes={};st.qText='';st.revealed=false;st.justRevealed=false;render();}
async function revealResults(){
  await fbSet('session/revealed',true);st.justRevealed=true;st.revealed=true;st.dashTab='voteBoard';render();
  setTimeout(()=>{st.justRevealed=false;},1200);}
async function submitVote(choice){
  if(!st.q||st.myVote||!st.name)return;
  await fbSet(`votes/${pid}`,{questionId:st.q.id,choice,name:st.name,pid});
  st.myVote=choice;render();}

/* ━━━━━━━━━━━━━━━━━━━━━━
   STOCK ACTIONS
━━━━━━━━━━━━━━━━━━━━━━ */
function getSortedStocks(){return Object.values(st.stockItems||{}).sort((a,b)=>(a.order||0)-(b.order||0));}
async function enterStock(){
  st.myCash=INIT_CASH;st.myPortfolio={};
  const ex=await fbGet(`stock/holdings/${pid}`);
  if(ex?.name){st.myCash=ex.cash||INIT_CASH;st.myPortfolio=ex.portfolio||{};}
  else await fbSet(`stock/holdings/${pid}`,{name:st.name,cash:INIT_CASH,portfolio:{}});
  st.view='parStock';render();startPoll('stock');}
async function addStock(){
  const name=st.newStockInput.trim();if(!name)return;
  const id='s'+Date.now();const order=Object.keys(st.stockItems||{}).length;
  st.stockItems[id]={id,name,order};await fbSet(`stock/items/${id}`,{id,name,order});
  if(st.stockStatus==='idle')await fbSet('stock/status','listing');
  st.stockStatus='listing';st.newStockInput='';render();}
async function removeStock(id){delete st.stockItems[id];await fbDel(`stock/items/${id}`);
  if(!Object.keys(st.stockItems||{}).length){await fbSet('stock/status','idle');st.stockStatus='idle';}render();}
async function startStockGame(){await fbSet('stock/status','active');st.stockStatus='active';render();}
async function endStockGame(){await fbSet('stock/status','ended');st.stockStatus='ended';render();}
async function resetStock(){await fbDel('stock');st.stockStatus='idle';st.stockItems={};st.allHoldings={};st.newStockInput='';render();}

/* ━━━━━━━━━━━━━━━━━━━━━━
   WHO AM I ACTIONS
━━━━━━━━━━━━━━━━━━━━━━ */
async function enterWho(){
  await fbSet(`who/participants/${pid}`,st.name);
  st.whoParticipants[pid]=st.name;
  st.view='parWho';render();startPoll('who');}

async function startWhoGame(){
  const pids=Object.keys(st.whoParticipants);
  if(pids.length<WHO_COUNT)return;
  // 랜덤 5명 선택 (Fisher-Yates)
  const shuffled=[...pids];
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  const selected=shuffled.slice(0,WHO_COUNT);
  const selObj={};selected.forEach((p,i)=>selObj[i]=p);
  await fbSet('who/selected',selObj);
  await fbSet('who/status','collecting');
  await fbDel('who/keywords');await fbDel('who/participantsDone');
  await fbSet('who/currentSubject',0);await fbSet('who/candidates',{});
  await fbSet('who/votingOpen',false);await fbSet('who/votes',null);await fbSet('who/revealed',false);
  st.whoSelected=selected;st.whoStatus='collecting';render();}

async function endWhoCollect(){
  await fbSet('who/status','revealing');st.whoStatus='revealing';render();}

async function resetWho(){
  await fbDel('who');
  st.whoStatus='idle';st.whoParticipants={};st.whoSelected=[];
  st.whoCurrentSubject=0;st.whoCandidates={};st.whoVotingOpen=false;
  st.whoVotes={};st.whoRevealed=false;st.whoKeywords={};st.whoParticipantsDone={};render();}

/* ━━━━━━━━━━━━━━━━━━━━━━
   POLLING
━━━━━━━━━━━━━━━━━━━━━━ */
function startPoll(role){
  stopPoll();
  const tick=async()=>{
    if(role==='dash'){
      const[q,v,anon,rev,ss,si,sh,whoAll]=await Promise.all([
        fbGet('session/q'),fbGet('votes'),fbGet('session/anon'),fbGet('session/revealed'),
        fbGet('stock/status'),fbGet('stock/items'),fbGet('stock/holdings'),fbGet('who')]);
      const wasRev=st.revealed;
      const changed=JSON.stringify(q)!==JSON.stringify(st.q)||JSON.stringify(v)!==JSON.stringify(st.votes)
        ||!!anon!==st.anon||!!rev!==st.revealed||ss!==st.stockStatus
        ||JSON.stringify(si)!==JSON.stringify(st.stockItems)||JSON.stringify(sh)!==JSON.stringify(st.allHoldings)
        ||JSON.stringify(whoAll)!==JSON.stringify(st._lastWho);
      st.q=q;st.votes=v||{};st.anon=!!anon;
      if(!!rev&&!wasRev){st.justRevealed=true;setTimeout(()=>{st.justRevealed=false;},1200);}
      st.revealed=!!rev;
      if(ss)st.stockStatus=ss;
      st.stockItems=si||{};st.allHoldings=sh||{};
      if(whoAll){
        st._lastWho=whoAll;
        st.whoStatus=whoAll.status||'idle';
        st.whoParticipants=whoAll.participants||{};
        if(whoAll.selected)st.whoSelected=Object.values(whoAll.selected);
        st.whoCandidates=whoAll.candidates||{};
        st.whoVotingOpen=!!whoAll.votingOpen;
        st.whoVotes=whoAll.votes||{};
        st.whoRevealed=!!whoAll.revealed;
        st.whoKeywords=whoAll.keywords||{};
        st.whoParticipantsDone=whoAll.participantsDone||{};
        if(whoAll.currentSubject!==undefined)st.whoCurrentSubject=whoAll.currentSubject;
      }
      if(changed)render();
    } else if(role==='par'){
      const q=await fbGet('session/q');
      if(q?.id!==st.q?.id)st.myVote=null;
      const changed=JSON.stringify(q)!==JSON.stringify(st.q);
      st.q=q;if(changed&&!st.myVote)render();
    } else if(role==='stock'){
      const[ss,si,myH]=await Promise.all([fbGet('stock/status'),fbGet('stock/items'),fbGet(`stock/holdings/${pid}`)]);
      const changed=ss!==st.stockStatus||JSON.stringify(si)!==JSON.stringify(st.stockItems);
      if(ss)st.stockStatus=ss;st.stockItems=si||{};
      if(myH){st.myCash=myH.cash||INIT_CASH;st.myPortfolio=myH.portfolio||{};}
      if(changed&&!st.tradeModal)render();
    } else if(role==='who'){
      const whoAll=await fbGet('who');
      if(whoAll){
        const newSt=whoAll.status||'idle';
        const newCands=JSON.stringify(whoAll.candidates||{});
        const changed=newSt!==st.whoStatus||newCands!==JSON.stringify(st.whoCandidates)||!!whoAll.votingOpen!==st.whoVotingOpen;
        st.whoStatus=newSt;
        st.whoParticipants=whoAll.participants||{};
        if(whoAll.selected)st.whoSelected=Object.values(whoAll.selected);
        st.whoCandidates=whoAll.candidates||{};
        st.whoVotingOpen=!!whoAll.votingOpen;
        st.whoParticipantsDone=whoAll.participantsDone||{};
        if(changed)render();
      }
    }
  };
  tick();pollTimer=setInterval(tick,2000);
}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}

render();
</script>
